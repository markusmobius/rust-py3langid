name: Rust Inference

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: cargo test --locked --example benchmark
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked --release --examples
      - uses: actions/setup-go@v6
        if: runner.os == 'Linux'
        with:
          go-version: 1.27.1
          cache-dependency-path: tools/go-reference/go.sum
      - if: runner.os == 'Linux'
        run: go -C tools/go-reference test -mod=readonly ./benchmark
      - if: runner.os == 'Linux'
        run: go -C tools/go-reference run -mod=readonly .
      - if: runner.os == 'Linux'
        run: cargo test --locked --release --lib live_go_parity -- --ignored --nocapture